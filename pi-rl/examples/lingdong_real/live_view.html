<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tron2 · 真机推理观测</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0d1420;color:#dbe5f3}
*{box-sizing:border-box}body{margin:0;padding:20px 28px;max-width:1700px;margin-inline:auto}
header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:23px;font-weight:650;margin:0 0 6px}
.sub,.note{color:#94a6bf;font-size:12px;line-height:1.7}.badge{border:1px solid #34445e;padding:8px 13px;border-radius:8px;white-space:nowrap}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:20px;margin:16px 0;font-size:13px}.action{color:#ed9234}.state{color:#35bba1}
select,button{background:#1a273b;color:#dbe5f3;border:1px solid #34445e;border-radius:5px;padding:6px 9px;cursor:pointer}
.cameras{display:grid;grid-template-columns:1fr 1fr;gap:14px}.camera,.plot{background:#141f30;border:1px solid #26344a;border-radius:9px;overflow:hidden}
.camera label{display:flex;justify-content:space-between;font-size:12px;padding:9px 12px;color:#b9c9df}.camera img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#080d15;max-height:360px}
.plots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.plot h2{font-size:12px;font-weight:500;margin:11px 12px 0}.plot canvas{width:100%;height:180px;display:block}
#recorded{display:none}video{width:100%;max-height:650px;background:#080d15;border-radius:9px}#metrics{font-variant-numeric:tabular-nums;line-height:1.8}
#error{color:#f7be74;font-size:13px;line-height:1.6;margin:10px 0}#error:not(:empty){padding:12px;border:1px solid #70512c;background:#2b2117;border-radius:7px}.note{margin-top:12px}
@media(max-width:1000px){.plots{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:14px}.camera img{max-height:240px}}
@media(max-width:550px){.cameras{grid-template-columns:1fr}header{align-items:flex-start}.badge{font-size:11px}.plots{grid-template-columns:1fr}}
</style>
<header><div><h1>Tron2 · 真机推理观测</h1><div class="sub" id="session"></div></div><div class="badge" id="status">等待数据</div></header>
<div class="bar"><span class="action">━ action · 模型目标</span><span class="state" id="stateLegend">━ state · 实测反馈</span><label>时间窗口 <select id="window"><option value="20">20 秒</option><option value="60">60 秒</option><option value="120">120 秒</option><option value="all">全部</option></select></label><span id="metrics"></span></div>
<div id="error"></div>
<div class="cameras" id="live"><div class="camera"><label>头部 RGB <span>cam_high</span></label><img id="head" alt="等待头部相机"></div><div class="camera"><label>右腕 RGB <span>cam_right_wrist</span></label><img id="wrist" alt="等待右腕相机"></div></div>
<div id="recorded"><video id="video" controls preload="metadata"></video></div>
<div class="plots" id="plots"></div>
<div class="note" id="note">橙线记录成功下发步骤对应的模型原始 action；绿线独立采样机器人反馈（20 Hz）。关节单位 rad；夹爪使用模型尺度 0～1，发送端乘 100 后取整、限幅。等待下一次推理期间橙线保持最后目标。图像与曲线使用同一个会话时间轴。</div>
<script>
const config=/*VIEW_CONFIG*/{};
const $=id=>document.getElementById(id);let events=config.events||[],seq=0,now=0,offline=config.mode==='recorded',status={},failed=0,sessionId=config.session;
const colors={action:'#ed9234',state:'#35bba1'};
$('session').textContent=config.session;
function updateNote(execution,source){
 $('stateLegend').textContent=source==='replay'?'━ state · 录制状态':'━ state · 实测反馈';
 let text=source==='replay'?'橙线为模拟执行步骤的模型原始 action；绿线来自每个推理循环读取的录制数据 state。横轴为回放运行时间，当前页面使用录制视频，未连接机器人。关节单位 rad；夹爪尺度 0～1。':'橙线记录成功下发步骤对应的模型原始 action；绿线独立采样机器人反馈（20 Hz）。关节单位 rad；夹爪使用模型尺度 0～1，发送端乘 100 后取整、限幅。等待下一次推理期间橙线保持最后目标。图像与曲线使用同一个会话时间轴。';
 if(execution==='fake')text='当前为模拟下发：橙线目标发给 FakeLink，未控制机器人。 '+text;
 if(execution==='dry')text='当前尚无真机动作下发。 '+text;
 $('note').textContent=text;
}
updateNote(config.execution,config.feedback_source);
for(let j=0;j<8;j++){let p=document.createElement('section');p.className='plot';let h=document.createElement('h2');h.textContent=config.names[j].replace('_Joint','')+(j===7?' · 0～1':' · rad');let c=document.createElement('canvas');c.dataset.j=j;p.append(h,c);$('plots').append(p)}
function draw(){
 let end=now,choice=$('window').value,span=choice==='all'?Math.max(1,end):Number(choice),left=Math.max(0,end-span),right=choice==='all'?Math.max(1,end):Math.max(span,end);
 let data={};for(const kind of ['action','state']){let a=events.filter(e=>e.kind===kind&&e.t<=end).sort((a,b)=>a.t-b.t);let i=a.findIndex(e=>e.t>=left);data[kind]=i<0?a.slice(-1):a.slice(Math.max(0,i-1))}
 for(const c of document.querySelectorAll('canvas')){
  let j=Number(c.dataset.j),w=c.clientWidth,h=180,dpr=devicePixelRatio||1;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  let g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const box={l:45,r:w-13,t:12,b:151};let vals=Object.values(data).flat().map(e=>e.values[j]);let low=vals.length?Math.min(...vals):-1,high=vals.length?Math.max(...vals):1,margin=Math.max((high-low)*.12,.03);low-=margin;high+=margin;if(j===7){low=Math.min(-.05,low);high=Math.max(1.05,high)}
  const x=t=>box.l+(Math.max(left,t)-left)/(right-left)*(box.r-box.l),y=v=>box.b-(v-low)/(high-low)*(box.b-box.t);
  g.font='10px system-ui';g.textAlign='right';for(let k=0;k<4;k++){let v=low+(high-low)*k/3,yy=y(v);g.strokeStyle='#27364c';g.beginPath();g.moveTo(box.l,yy);g.lineTo(box.r,yy);g.stroke();g.fillStyle='#8ca2c0';g.fillText(v.toFixed(2),box.l-6,yy+3)}
  g.textAlign='left';g.fillText(left.toFixed(1)+'s',box.l,172);g.textAlign='right';g.fillText(right.toFixed(1)+'s',box.r,172);
  g.save();g.beginPath();g.rect(box.l,box.t,box.r-box.l,box.b-box.t);g.clip();
  for(const kind of ['state','action']){let a=data[kind];g.strokeStyle=colors[kind];g.lineWidth=1.8;g.beginPath();a.forEach((e,i)=>{if(!i)g.moveTo(x(e.t),y(e.values[j]));else{if(kind==='action')g.lineTo(x(e.t),y(a[i-1].values[j]));g.lineTo(x(e.t),y(e.values[j]))}});if(a.length&&kind==='action')g.lineTo(x(end),y(a.at(-1).values[j]));g.stroke()}
  g.restore();let lastA=data.action.at(-1),lastS=data.state.at(-1);g.textAlign='right';g.fillStyle='#d1ddeb';g.fillText('a '+(lastA?lastA.values[j].toFixed(3):'—')+'   s '+(lastS?lastS.values[j].toFixed(3):'—'),box.r,24);
 }
}
async function poll(){try{let r=await fetch('/api?after='+seq+'&session='+encodeURIComponent(sessionId),{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json();
 if((d.session&&d.session!==sessionId)||d.seq<seq){events=[];seq=0;sessionId=d.session;$('session').textContent=sessionId}
 seq=d.seq;events.push(...d.events);now=d.now;status=d.status;failed=0;
 updateNote(status.execution,d.feedback_source||config.feedback_source);
 $('status').textContent=(status.phase.includes('失败')?'':(status.execution==='real'?'真机':status.execution==='fake'?'模拟下发':'只观测')+' · ')+status.phase;
 $('metrics').textContent='t '+now.toFixed(1)+'s'+(status.cycle!=null?' · cycle '+status.cycle:'')+(status.infer_ms!=null?' · 推理 '+status.infer_ms.toFixed(0)+' ms':'');
 const st=events.filter(e=>e.kind==='state').at(-1);let warning=st&&st.joint_age_s>.5?'关节反馈已过期 '+st.joint_age_s.toFixed(1)+'s。 ':'';
 $('error').textContent=(d.error||'')+warning+(d.dropped?'丢弃可视化采样 '+d.dropped+' 条。 ':'')+(d.video_error?'录像异常：'+d.video_error:'');draw();
 }catch(e){failed++;$('status').textContent='连接已断开 · 保留当前画面';$('error').textContent='推理结束后可打开日志目录中的 visualization.html 回看。'}
 setTimeout(poll,200)}
function refreshImages(){for(const id of ['head','wrist']){let img=$(id);if(!img.dataset.busy){img.dataset.busy='1';img.onload=img.onerror=()=>{delete img.dataset.busy};img.src='/'+id+'.jpg?t='+Date.now()}}if(!offline)setTimeout(refreshImages,125)}
if(offline){$('live').style.display='none';$('recorded').style.display='block';$('status').textContent='会话回放';now=events.length?Math.max(...events.map(e=>e.t)):0;$('window').value='all';let v=$('video');v.src='dashboard.mp4';v.addEventListener('timeupdate',()=>{now=v.currentTime+(config.video_offset||0);draw()});v.addEventListener('error',()=>{$('error').textContent='请将 visualization.html 与 dashboard.mp4 保持在同一目录。曲线可独立查看。'});draw()}else{poll();refreshImages()}
$('window').addEventListener('change',draw);addEventListener('resize',draw);
</script>
</html>
